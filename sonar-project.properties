# Configuración del análisis en SonarCloud (https://sonarcloud.io)
# organization y projectKey deben coincidir con los que muestra SonarCloud
# al importar el repositorio (Information del proyecto).
sonar.organization=clmoralesl
sonar.projectKey=clmoralesl_EV3_CALIDAD_VGUARDIA_CMORALES
sonar.projectName=CuidartePlus

# Código a analizar
sonar.sources=BACKEND/src,FRONTEND/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.sql
sonar.sourceEncoding=UTF-8

# Importar los hallazgos de ESLint generados en el pipeline
sonar.eslint.reportPaths=BACKEND/eslint-report.json,FRONTEND/eslint-report.json
