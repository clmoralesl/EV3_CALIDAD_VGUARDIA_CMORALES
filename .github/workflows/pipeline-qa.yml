# Pipeline CI/CD de calidad y seguridad de CuidartePlus (orquestador, issue #9).
# Único punto de entrada: se ejecuta en cada PR hacia qa, en cada push a qa y manualmente.
# Cada etapa es un workflow reutilizable (.github/workflows/etapa-N-*.yml).
#
#   ┌ 2. SCA (Snyk) ────────────┐
#   │                           ├─> 4. E2E (Playwright) ─┬─> 5. DAST (ZAP) ────────┐
#   └ 3. API (Vitest) ─> 1. SAST┘                        └─> 6. Rendimiento (Locust)┴─> 7. Deploy (qa)
#
# SAST corre después de las pruebas de API para enviar su cobertura (lcov) a SonarCloud.
# Quality gates: una etapa que falla bloquea las siguientes. Política "bloquear solo lo nuevo":
# CuidartePlus tiene defectos INTENCIONALES (caso de estudio) registrados como línea base; se
# reportan pero no bloquean. Una etapa falla solo ante un defecto NUEVO o si no puede ejecutarse.
#   - ESLint: eslint-suppressions.json · SonarCloud: Quality Gate sobre código nuevo
#   - Snyk: .snyk (excepciones con expiración) · ZAP: .zap/rules.tsv (WARN/FAIL)
#   - Vitest / Playwright: it.fails / test.fail para defectos conocidos
#   - Locust: tests/performance/umbrales.json
# En PR el deploy corre como ENSAYO (sin aprobación); en push a qa espera la aprobación manual.

name: Pipeline QA

on:
  push:
    branches: [qa]
  pull_request:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: read

# En PR cancela la ejecución anterior del mismo PR. En qa cada push tiene su propio grupo (run_id):
# no se cancela ni se encola nada; los despliegues ya se serializan en la etapa 7.
concurrency:
  group: pipeline-qa-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sca:
    name: SCA
    uses: ./.github/workflows/etapa-2-sca.yml
    secrets: inherit
    permissions:
      contents: read
      security-events: write # SARIF a Security > Code scanning

  api:
    name: API
    uses: ./.github/workflows/etapa-3-api.yml

  sast:
    name: SAST
    needs: [api]
    if: ${{ !cancelled() }} # corre aunque fallen las pruebas de API (la cobertura es opcional)
    uses: ./.github/workflows/etapa-1-sast.yml
    secrets: inherit
    with:
      cobertura: true
    permissions:
      contents: read
      pull-requests: read # SonarCloud decora el análisis del PR

  e2e:
    name: E2E
    needs: [sast, sca, api]
    uses: ./.github/workflows/etapa-4-e2e.yml

  dast:
    name: DAST
    needs: [e2e]
    uses: ./.github/workflows/etapa-5-dast.yml

  rendimiento:
    name: Rendimiento
    needs: [e2e]
    uses: ./.github/workflows/etapa-6-rendimiento.yml

  deploy:
    name: Deploy
    needs: [dast, rendimiento]
    uses: ./.github/workflows/etapa-7-deploy.yml
    permissions:
      contents: read
      actions: read # leer quién aprobó el despliegue

  resumen:
    name: Resumen del pipeline
    needs: [sca, api, sast, e2e, dast, rendimiento, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Tabla de resultados
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.loads(os.environ["RESULTADOS"])
          etapas = [
              ("1. SAST (ESLint + SonarCloud)", "sast"),
              ("2. SCA (Snyk)", "sca"),
              ("3. Pruebas de API (Vitest + Supertest)", "api"),
              ("4. E2E (Playwright)", "e2e"),
              ("5. DAST (OWASP ZAP)", "dast"),
              ("6. Rendimiento (Locust)", "rendimiento"),
              ("7. Deploy simulado", "deploy"),
          ]
          icono = {"success": "✅ aprobada", "failure": "❌ falló", "cancelled": "⏹️ cancelada", "skipped": "⏭️ bloqueada / omitida"}
          print("## Pipeline QA - resultado por etapa\n")
          print("| Etapa | Resultado |\n|---|---|")
          for nombre, clave in etapas:
              print(f"| {nombre} | {icono.get(r[clave]['result'], r[clave]['result'])} |")
          ok = all(r[c]["result"] == "success" for _, c in etapas)
          print(f"\n**Resultado global:** {'✅ todas las etapas aprobadas' if ok else '❌ hay etapas fallidas o bloqueadas'}")
          print("\nEl detalle de cada etapa está en su propio resumen y en los artefactos del run.")
          EOF

      - name: Resultado global
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json,os,sys; r=json.loads(os.environ['RESULTADOS']); sys.exit(0 if all(v['result']=='success' for v in r.values()) else 1)"
