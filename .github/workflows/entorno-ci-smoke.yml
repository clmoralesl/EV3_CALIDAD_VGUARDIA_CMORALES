# Workflow TEMPORAL (issue #1): verifica que la acción entorno-ci levanta la app.
# Se elimina en el issue #9, cuando el orquestador use la acción en las etapas reales.

name: Smoke test entorno CI

on:
  pull_request:
    branches: [qa]
    paths:
      - docker-compose*.yml
      - BACKEND/Dockerfile
      - FRONTEND/Dockerfile
      - FRONTEND/.dockerignore
      - .github/actions/entorno-ci/**
      - .github/workflows/entorno-ci-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Levantar entorno y verificar servicios
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Levantar entorno
        id: entorno
        uses: ./.github/actions/entorno-ci

      - name: API responde
        run: |
          respuesta=$(curl --fail --silent --show-error "${{ steps.entorno.outputs.api_url }}/")
          echo "API: $respuesta"
          echo "$respuesta" | grep -q '"status":"ok"'

      - name: Frontend responde
        run: |
          curl --fail --silent --show-error "${{ steps.entorno.outputs.web_url }}/" | grep -qi "<div id=\"root\">"
          echo "Frontend OK"

      - name: Dump de prueba cargado
        run: |
          usuarios=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T cuidarteplus-postgres-ev \
            psql -U postgres -d cuidarteplus -t -A -c "SELECT COUNT(*) FROM usuarios;")
          echo "Usuarios en la BD: $usuarios"
          test "$usuarios" -gt 0

      - name: La API corre sin privilegios de root
        run: |
          usuario=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T cuidarteplus-backend-ev whoami)
          echo "Usuario del proceso: $usuario"
          test "$usuario" = "node"

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Entorno CI"
            echo "| Servicio | URL |"
            echo "|---|---|"
            echo "| API | ${{ steps.entorno.outputs.api_url }} |"
            echo "| Frontend | ${{ steps.entorno.outputs.web_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar entorno
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
